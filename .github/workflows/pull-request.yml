name: Compatibility checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm run test --runInBand
      - run: pnpm build-lib
      - run: pnpm test:package

  browser:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        react: ['18.2.0', '19.2.8']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.react == '19.2.8'
        run: pnpm add -Dw -E react@19.2.8 react-dom@19.2.8
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build-lib
      - run: pnpm test:browser
