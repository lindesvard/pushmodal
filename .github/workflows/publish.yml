name: Publish npm package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm run test --runInBand
      - run: node --test scripts/check-release.test.cjs

  publish:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-lib
      - run: pnpm test:package
      - name: Check stable release version
        id: release
        run: node scripts/check-release.cjs
      - name: Validate npm package without publishing
        run: npm publish --dry-run --access public --tag latest --registry https://registry.npmjs.org
        working-directory: lib
      - name: Authenticate and publish stable release
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'lindesvard/pushmodal' &&
          steps.release.outputs.publish == 'true'
        shell: bash
        working-directory: lib
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The NPM_TOKEN repository secret is missing."
            exit 1
          fi
          npm whoami --registry https://registry.npmjs.org > /dev/null
          npm publish --access public --tag latest --registry https://registry.npmjs.org
